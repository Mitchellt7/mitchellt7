<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Buddy</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Budget Buddy</h1>
      <section class="grid stats">
        <div><h3>Income</h3><p id="income">$0.00</p></div>
        <div><h3>Expenses</h3><p id="expenses">$0.00</p></div>
        <div><h3>Balance</h3><p id="balance">$0.00</p></div>
      </section>

      <section class="card">
        <h2>Add Transaction</h2>
        <form id="tx-form">
          <input id="title" placeholder="Title" required />
          <input id="amount" placeholder="Amount" type="number" min="0.01" step="0.01" required />
          <select id="type"><option value="expense">Expense</option><option value="income">Income</option></select>
          <input id="category" placeholder="Category" value="Other" required />
          <button type="submit">Save</button>
        </form>
      </section>

      <section class="grid two">
        <div class="card"><h2>Spending by Category</h2><ul id="by-category"></ul></div>
        <div class="card"><h2>Recent Transactions</h2><ul id="list"></ul></div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
